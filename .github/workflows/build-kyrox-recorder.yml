name: Build KYROX Recorder

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-kyrox-recorder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension ZIP
        run: npm run package

      - name: Upload KYROX Recorder
        uses: actions/upload-artifact@v4
        with:
          name: kyrox-recorder-extension
          path: extension.zip
          if-no-files-found: error
          retention-days: 7
